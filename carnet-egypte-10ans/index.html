:root{--ink:#2B2118;--sand:#F4E6C8;--sand2:#E9D3A6;--lapis:#1F4E8C;--terra:#B8532A;--gold:#C9962F;--nile:#3E8EC4;--muted:#7d6e57;--line:#d9c9a6;--bg:#fbf7ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Marianne,system-ui,sans-serif;font-size:16px;line-height:1.45}
.hiero{font-family:Hiero}.ar{font-family:Arabic,serif;direction:rtl;unicode-bidi:isolate}
header{position:sticky;top:0;z-index:20;background:var(--lapis);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-weight:700}
header .t{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#saved{font-size:12px;opacity:.85;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:14px 14px 110px}
h1{font-size:28px;margin:6px 0 4px;line-height:1.15}
h2{font-size:23px;margin:0;line-height:1.15}
.band{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--terra);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.num.blue{background:var(--lapis)}.num.gold{background:var(--gold)}
.sub{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--terra);font-weight:500}
.card{background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:14px;margin:0 0 14px}
.info{background:var(--sand);border-left:6px solid var(--gold);border-radius:8px;padding:12px 14px;margin:0 0 14px}
.info .it{color:var(--terra);font-weight:700;margin-bottom:4px}
.info p{margin:0 0 8px}.info p:last-child{margin:0}
.lab{font-weight:700;margin:0 0 8px}
.small{font-size:13px}.muted{color:var(--muted)}
label.f{display:block;margin:0 0 10px}
label.f span{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fffdf8;border:1.5px solid #c9b88f;border-radius:10px;padding:10px}
textarea{min-height:90px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:3px solid rgba(62,142,196,.35);border-color:var(--nile)}
.checks{display:grid;grid-template-columns:1fr;gap:6px}
.checks label{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fffdf8}
.checks input{width:22px;height:22px;accent-color:var(--terra);flex:none}
.hunt label{align-items:flex-start;flex-wrap:wrap}
.hunt input[type=text]{margin-top:6px}
.stars{display:flex;gap:6px}
.stars button{background:none;border:0;padding:2px;font-size:34px;line-height:1;color:#c9b88f;cursor:pointer}
.stars button.on{color:var(--gold)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{font:inherit;border:1.5px solid var(--line);background:#fffdf8;border-radius:999px;padding:8px 14px;color:var(--ink)}
.pills button.on{background:var(--lapis);border-color:var(--lapis);color:#fff}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.ph{position:relative;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ph img{display:block;width:100%;height:150px;object-fit:cover}
.ph input{border:0;border-top:1px solid var(--line);border-radius:0;font-size:14px;padding:8px}
.ph .del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:30px;height:30px;font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--terra);color:#fff;cursor:pointer}
.btn.alt{background:var(--lapis)}.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.full{width:100%}
.draw canvas{width:100%;height:300px;background:#fff;border:1.5px dashed var(--ink);border-radius:10px;touch-action:none;display:block}
.tools{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.tools .c{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--ink)}
.tools .c.on{box-shadow:0 0 0 3px var(--terra)}
.tools button.s{font:inherit;font-size:14px;border:1.5px solid var(--ink);background:#fff;border-radius:8px;padding:6px 10px}
.svgw svg{max-width:100%;height:auto}
.row2{display:grid;grid-template-columns:1fr;gap:10px}
.order{display:flex;gap:8px;flex-wrap:wrap}.order select{width:64px;text-align:center}
.letter{color:var(--terra);font-weight:700}
.toc a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.toc .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--terra);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.toc .n.blue{background:var(--lapis)}.toc .n.gold{background:var(--gold)}
.toc .tt{flex:1;min-width:0}.toc .tt b{display:block}
.prog{height:6px;border-radius:3px;background:#eee3cc;overflow:hidden;margin-top:4px}.prog i{display:block;height:100%;background:var(--gold)}
.toc .ok{color:#2e7d32;font-weight:700}
nav.pn{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid var(--line);display:flex;gap:10px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));z-index:20}
nav.pn .btn{flex:1}
.cw{overflow-x:auto;padding-bottom:6px}
.cw table{border-collapse:collapse;margin:0 auto}
.cw td{width:30px;height:30px;padding:0;position:relative}
.cw td.w{border:1.5px solid var(--ink);background:#fff}
.cw td input{width:100%;height:100%;border:0;border-radius:0;padding:0;text-align:center;text-transform:uppercase;font-weight:700;font-size:16px;background:transparent}
.cw td sup{position:absolute;top:1px;left:2px;font-size:9px;pointer-events:none}
.clues p{margin:0 0 6px;font-size:14px}
.alpha{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.alpha div{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff;font-size:13px}
.alpha .g{font-size:26px;line-height:1.1}
.hout{font-size:34px;min-height:52px;border:2px solid var(--ink);border-radius:40px;padding:6px 18px;background:#fff;margin-top:8px;word-break:break-all}
.frise .slot{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.fossil{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fffdf8}
.lock{text-align:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.cover{text-align:center}
.cover .hiero{font-size:30px;color:var(--lapis);letter-spacing:8px}
@media (min-width:600px){.checks{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr 1fr}.photos{grid-template-columns:repeat(3,1fr)}}
/* impression du carnet complet */
#printview{display:none}
@media print{
  header,nav.pn,main,.toast{display:none!important}
  #printview{display:block}
  body{background:#fff;font-size:11pt}
  .pv-page{page-break-after:always;padding:0 4mm}
  .pv-page h2{margin-bottom:6px}
  .pv-q{margin:0 0 6px}.pv-q b{display:block;font-size:10pt;color:var(--muted)}
  .pv-imgs{display:flex;flex-wrap:wrap;gap:6px}.pv-imgs img{max-width:48%;max-height:70mm;border-radius:6px}
  .pv-draw{max-width:100%;max-height:90mm;border:1px solid #ccc;border-radius:6px}
}
</style>
</head>

</text></g></svg>", "label": "Zoom sur Le Caire", "after": ""}, {"t": "info", "title": "L'itinéraire", "html": "<p>① Fayoum, désert géologique · ② village de Tunis · ③ Grand Musée, pyramides de Gizeh et Sphinx · ④ felouque sur le Nil · ⑤ Khan el-Khalili · ⑥ Sakkarah et Sérapéum · ⑦ musée des momies. ⌂ = Maadi, notre base.</p>"}, {"t": "fields", "label": "Missions de cartographe (utilise les échelles des cartes)", "items": [{"id": "carte.f.0", "label": "Distance à vol d'oiseau Maadi ⌂ → village de Tunis ② (en km)", "lines": 1}, {"id": "carte.f.1", "label": "Distance Grand Musée ③ → Khan el-Khalili ⑤ (en km)", "lines": 1}, {"id": "carte.f.2", "label": "Durée du trajet Maadi → Fayoum", "lines": 1}, {"id": "carte.f.3", "label": "Vitesse moyenne approximative (en km/h)", "lines": 1}]}, {"t": "text", "id": "carte.notes", "label": "Mes notes de route : temps de trajet, paysages vus par la fenêtre, panneaux…", "lines": 4, "ph": ""}]}, {"title": "La frise du temps", "sub": "Se repérer dans le temps", "num": "★", "color": "blue", "blocks": [{"t": "frise", "id": "frise", "label": "Écris la lettre de chaque événement dans la bonne période de 500 ans.", "svg": "<svg viewBox=\"0 0 630 84\" width=\"100%\"><line x1=\"20\" y1=\"48\" x2=\"610\" y2=\"48\" stroke=\"#2B2118\" stroke-width=\"3\"/><polygon points=\"618,48 606,42 606,54\" fill=\"#2B2118\"/><line x1=\"20.0\" y1=\"40\" x2=\"20.0\" y2=\"56\" stroke=\"#2B2118\" stroke-width=\"2\"/><text x=\"20.0\" y=\"74\" font-family=\"Marianne\" font-size=\"14\" text-anchor=\"middle\">-3000</text><line x1=\"76.9\" y1=\"40\" x2=\"76.9\" y2=\"50\" stroke=\"#2B2118\" stroke-width=\"1\"/><line x1=\"133.7\" y1=\"40\" x2=\"133.7\" y2=\"56\" stroke=\"#2B2118\" stroke-width=\"2\"/><text x=\"133.7\" y=\"74\" font-family=\"Marianne\" font-size=\"14\" text-anchor=\"middle\">-2000</text><line x1=\"190.6\" y1=\"40\" x2=\"190.6\" y2=\"50\" stroke=\"#2B2118\" stroke-width=\"1\"/><line x1=\"247.5\" y1=\"40\" x2=\"247.5\" y2=\"56\" stroke=\"#2B2118\" stroke-width=\"2\"/><text x=\"247.5\" y=\"74\" font-family=\"Marianne\" font-size=\"14\" text-anchor=\"middle\">-1000</text><line x1=\"304.3\" y1=\"40\" x2=\"304.3\" y2=\"50\" stroke=\"#2B2118\" stroke-width=\"1\"/><line x1=\"361.2\" y1=\"40\" x2=\"361.2\" y2=\"56\" stroke=\"#2B2118\" stroke-width=\"2\"/><text x=\"361.2\" y=\"74\" font-family=\"Marianne\" font-size=\"14\" text-anchor=\"middle\">an 1</text><line x1=\"418.0\" y1=\"40\" x2=\"418.0\" y2=\"50\" stroke=\"#2B2118\" stroke-width=\"1\"/><line x1=\"474.9\" y1=\"40\" x2=\"474.9\" y2=\"56\" stroke=\"#2B2118\" stroke-width=\"2\"/><text x=\"474.9\" y=\"74\" font-family=\"Marianne\" font-size=\"14\" text-anchor=\"middle\">1000</text><line x1=\"531.8\" y1=\"40\" x2=\"531.8\" y2=\"50\" stroke=\"#2B2118\" stroke-width=\"1\"/><line x1=\"588.6\" y1=\"40\" x2=\"588.6\" y2=\"56\" stroke=\"#2B2118\" stroke-width=\"2\"/><text x=\"588.6\" y=\"74\" font-family=\"Marianne\" font-size=\"14\" text-anchor=\"middle\">2000</text><text x=\"191\" y=\"22\" font-family=\"Marianne\" font-size=\"14\" fill=\"#B8532A\" text-anchor=\"middle\">avant notre ère</text><text x=\"475\" y=\"22\" font-family=\"Marianne\" font-size=\"14\" fill=\"#B8532A\" text-anchor=\"middle\">notre ère</text></svg>", "events": [["A", "Construction de la pyramide de Djéser à Sakkarah", "vers 2650 av. J.-C."], ["B", "Construction de la pyramide de Khéops", "vers 2560 av. J.-C."], ["C", "Règne de Toutânkhamon", "vers 1330 av. J.-C."], ["D", "Règne de Ramsès II", "vers 1250 av. J.-C."], ["E", "Mort de Cléopâtre, dernière reine d'Égypte", "30 av. J.-C."], ["F", "Découverte de la tombe de Toutânkhamon", "1922"], ["G", "« Parade dorée » : 22 momies royales changent de musée", "2021"], ["H", "Ouverture complète du Grand Musée égyptien", "2025"], ["I", "Construction du caravansérail de Khan el-Khalili", "1382"]], "slots": ["−3000 à −2501", "−2500 à −2001", "−2000 à −1501", "−1500 à −1001", "−1000 à −501", "−500 à −1", "1 à 500", "501 à 1000", "1001 à 1500", "1501 à 2000", "après 2000"]}, {"t": "fields", "label": "Calculs d'historien", "items": [{"id": "frise.calc.0", "label": "Années entre la pyramide de Khéops et la mort de Cléopâtre", "lines": 1}, {"id": "frise.calc.1", "label": "Années entre la mort de Cléopâtre et aujourd'hui", "lines": 1}, {"id": "frise.calc.2", "label": "Cléopâtre a-t-elle vécu plus près des pyramides ou de nous ?", "lines": 1}]}]}, {"title": "Le Fayoum", "sub": "Étape 1 · dossier", "num": 1, "color": "gold", "blocks": [{"t": "info", "title": "Ce qu'il faut savoir", "html": "<p>Il y a environ <b>40 millions d'années</b>, le nord de l'Égypte était recouvert par une mer chaude, la <b>Téthys</b>. Ses sédiments sont devenus des roches (calcaire, grès) qui contiennent aujourd'hui des milliers de <b>fossiles marins</b> : dents de requins, coquillages, oursins, nummulites…</p>\n        <p>À <b>Wadi El-Hitan</b> (la « Vallée des baleines »), inscrite au patrimoine mondial de l'UNESCO, on a retrouvé des squelettes de baleines primitives, comme le <i>Basilosaurus</i> (jusqu'à 18 m de long). Elles possédaient encore de minuscules pattes arrière : une preuve de l'évolution des baleines, dont les ancêtres vivaient sur la terre ferme.</p>\n        <p>Le <b>lac Qarun</b> est un lac salé, reste d'un lac bien plus grand dans l'Antiquité. Il accueille de nombreux oiseaux migrateurs en hiver.</p>"}, {"t": "text", "id": "fay.q1", "label": "1. Pourquoi trouve-t-on des dents de requin au milieu du désert ?", "lines": 3, "ph": ""}, {"t": "text", "id": "fay.q2", "label": "2. Un Basilosaurus mesurait 18 m. Combien d'élèves de 1,50 m allongés bout à bout faudrait-il pour atteindre sa longueur ?", "lines": 1, "ph": ""}, {"t": "text", "id": "fay.q3", "label": "3. Les requins perdent et remplacent leurs dents toute leur vie (plusieurs milliers). Pourquoi est-ce une bonne explication au grand nombre de dents fossiles ?", "lines": 3, "ph": ""}, {"t": "draw", "id": "fay.basilo", "label": "Croquis : une baleine à pattes. Dessine un Basilosaurus et légende-le (crâne, colonne vertébrale, nageoire, petite patte arrière)."}]}, {"title": "Mon carnet de paléontologue", "sub": "Étape 1 · Fayoum", "num": 1, "color": "gold", "blocks": [{"t": "info", "title": "Règles du paléontologue", "html": "<p>Je demande toujours au guide si l'on a le droit de ramasser à cet endroit. Je ne casse pas la roche. Je photographie le fossile en place, avec un objet pour l'échelle, avant de le ramasser.</p>"}, {"t": "fossils", "id": "fossiles", "label": "Mes trouvailles : une fiche par fossile, avec sa photo", "guide": "<div style=\"text-align:center;width:19%\"><svg width=\"46\" height=\"46\" viewBox=\"0 0 70 75\" fill=\"none\" stroke=\"#2B2118\" stroke-width=\"2.4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M14 62 Q20 40 30 12 Q34 6 38 12 Q48 40 56 62 Q35 54 14 62Z\"/><path d=\"M10 64 Q35 56 60 64 L58 70 Q35 64 12 70Z\"/><path d=\"M30 20 L26 50\" opacity=\".5\"/></svg><div class=\"small\">Dent de requin</div></div><div style=\"text-align:center;width:19%\"><svg width=\"46\" height=\"46\" viewBox=\"0 0 70 75\" fill=\"none\" stroke=\"#2B2118\" stroke-width=\"2.4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><ellipse cx=\"35\" cy=\"38\" rx=\"30\" ry=\"29\"/><polyline points=\"38.0,38.0 38.4,39.9 37.6,42.0 35.4,43.7 32.3,44.0 29.0,42.5 26.7,39.2 26.3,34.7 28.3,30.3 32.7,27.1 38.4,26.5 44.1,28.9 48.3,34.1 49.4,41.2 46.8,48.2 40.7,53.5 32.5,55.2 24.0,52.6 17.5,45.9 15.0,36.5 17.4,26.6 24.6,18.7 35.1,15.2 46.5,17.3 55.8,24.8 60.4,36.3 59.0,49.1 51.2,59.9 38.9,65.9 24.7,65.2 12.2,57.5 4.8,44.4 4.5,28.8 12.0,14.7\"/></svg><div class=\"small\">Nummulite</div></div><div style=\"text-align:center;width:19%\"><svg width=\"46\" height=\"46\" viewBox=\"0 0 70 75\" fill=\"none\" stroke=\"#2B2118\" stroke-width=\"2.4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M35 64 L10 40 Q8 16 35 10 Q62 16 60 40 Z\"/><path d=\"M35 64 L61.0 30.7\"/><path d=\"M35 64 L56.6 23.9\"/><path d=\"M35 64 L50.0 18.7\"/><path d=\"M35 64 L42.0 15.6\"/><path d=\"M35 64 L33.2 14.8\"/><path d=\"M35 64 L24.7 16.6\"/><path d=\"M35 64 L17.2 20.6\"/><path d=\"M35 64 L11.4 26.5\"/><path d=\"M26 64 h18 v4 h-18z\"/></svg><div class=\"small\">Bivalve</div></div><div style=\"text-align:center;width:19%\"><svg width=\"46\" height=\"46\" viewBox=\"0 0 70 75\" fill=\"none\" stroke=\"#2B2118\" stroke-width=\"2.4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><circle cx=\"35\" cy=\"36\" r=\"29\"/><ellipse cx=\"35.0\" cy=\"24.0\" rx=\"9\" ry=\"3.4\" transform=\"rotate(-90 35.0 24.0)\"/><ellipse cx=\"46.4\" cy=\"32.3\" rx=\"9\" ry=\"3.4\" transform=\"rotate(-18 46.4 32.3)\"/><ellipse cx=\"42.1\" cy=\"45.7\" rx=\"9\" ry=\"3.4\" transform=\"rotate(54 42.1 45.7)\"/><ellipse cx=\"27.9\" cy=\"45.7\" rx=\"9\" ry=\"3.4\" transform=\"rotate(126 27.9 45.7)\"/><ellipse cx=\"23.6\" cy=\"32.3\" rx=\"9\" ry=\"3.4\" transform=\"rotate(198 23.6 32.3)\"/><circle cx=\"35\" cy=\"36\" r=\"2.5\"/></svg><div class=\"small\">Oursin</div></div><div style=\"text-align:center;width:19%\"><svg width=\"46\" height=\"46\" viewBox=\"0 0 70 75\" fill=\"none\" stroke=\"#2B2118\" stroke-width=\"2.4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M20 64 L35 8 L50 64 Z\"/><path d=\"M24 50 Q35 44 46 50\"/><path d=\"M27 38 Q35 33 43 38\"/><path d=\"M30 26 Q35 22 40 26\"/><path d=\"M20 64 Q35 72 50 64\"/></svg><div class=\"small\">Gastéropode</div></div>", "types": ["Dent de requin", "Nummulite", "Bivalve (huître…)", "Oursin", "Gastéropode", "Os / vertèbre", "Autre"]}, {"t": "fields", "label": "Statistiques de l'équipe", "items": [{"id": "fossiles.stats.0", "label": "Nombre total de fossiles", "lines": 1}, {"id": "fossiles.stats.1", "label": "Type le plus fréquent", "lines": 1}, {"id": "fossiles.stats.2", "label": "Plus grande dent (mm)", "lines": 1}]}]}, {"title": "Anniversaire au lac Qarun", "sub": "Étape 1 · Fayoum", "num": 1, "color": "gold", "blocks": [{"t": "fields", "label": "", "items": [{"id": "anniv.f.0", "label": "Aujourd'hui, nous fêtons l'anniversaire de", "lines": 1}, {"id": "anniv.f.1", "label": "qui a", "lines": 1}, {"id": "anniv.f.2", "label": "Lieu exact de la fête", "lines": 1}]}, {"t": "photos", "id": "anniv.ph", "label": "Photos de la fête", "help": ""}, {"t": "text", "id": "anniv.fete", "label": "Une fête dans le désert : la musique (instruments, chansons), les guirlandes lumineuses, les invités…", "lines": 4, "ph": ""}, {"t": "text", "id": "anniv.carte", "label": "Ma carte d'anniversaire : écris un message (tu peux ajouter un mot en arabe : عيد ميلاد سعيد = « joyeux anniversaire »).", "lines": 4, "ph": ""}, {"t": "text", "id": "anniv.decor", "label": "Le décor : décris le désert à la nuit tombée, les lumières et l'ambiance de la fête en 3 phrases.", "lines": 3, "ph": ""}]}, {"title": "Tunis, le village des potiers", "sub": "Étape 2 · dossier", "num": 2, "blocks": [{"t": "info", "title": "Ce qu'il faut savoir", "html": "<p>Tunis est un village du Fayoum qui domine le lac Qarun. Dans les années 1980, une potière suisse, <b>Evelyne Porret</b>, y a ouvert une école de poterie et a formé les enfants du village. Beaucoup sont devenus potiers à leur tour et ont ouvert leur propre atelier : le village est aujourd'hui connu dans toute l'Égypte pour ses céramiques décorées d'animaux, de plantes et de scènes de la vie locale.</p>\n        <p>Une poterie est faite d'<b>argile</b>, une roche très fine qui devient souple quand on la mouille. Une fois façonnée et séchée, elle est cuite dans un four vers 900 à 1 000 °C : elle devient alors dure, et ne peut plus redevenir de l'argile.</p>"}, {"t": "order", "id": "tunis.ordre", "label": "Remets dans l'ordre les étapes de fabrication :", "n": 4, "letters": ["A", "B", "C", "D"], "items": [["A", "On façonne la pièce sur le tour du potier."], ["B", "On peint et on émaille la pièce, puis on la recuit."], ["C", "On prépare l'argile en la mouillant et en la malaxant pour chasser les bulles d'air."], ["D", "On laisse sécher, puis on cuit la pièce dans un four très chaud."]]}, {"t": "text", "id": "tunis.pc", "label": "Physique-chimie : pourquoi faut-il bien laisser sécher une poterie avant de la cuire ? Que pourrait-il arriver sinon ?", "lines": 3, "ph": ""}, {"t": "draw", "id": "tunis.motif", "label": "Dessine un motif pour décorer un bol (frise ou motif central inspiré du lac, des oiseaux, des palmiers…)"}, {"t": "fields", "label": "", "items": [{"id": "tunis.f.0", "label": "Atelier visité", "lines": 1}, {"id": "tunis.f.1", "label": "Potier / potière", "lines": 1}, {"id": "tunis.f.2", "label": "Objet préféré", "lines": 1}, {"id": "tunis.f.3", "label": "Prix (en livres)", "lines": 1}]}]}, {"title": "Tunis", "sub": "Carnet de terrain", "num": 2, "color": "", "blocks": [{"t": "fields", "label": "", "items": [{"id": "terr.tunis.f.0", "label": "Date", "lines": 1}, {"id": "terr.tunis.f.1", "label": "Heure d'arrivée", "lines": 1}, {"id": "terr.tunis.f.2", "label": "Avec qui", "lines": 1}]}, {"t": "pills", "id": "terr.tunis.meteo", "label": "La météo du jour", "options": ["☀️ Soleil", "☁️ Nuages", "💨 Vent", "🌡️ Très chaud", "❄️ Frais"], "multi": true}, {"t": "photos", "id": "terr.tunis.ph", "label": "Mes photos du jour", "help": "Prends-les avec le téléphone ou choisis-les dans la galerie, puis ajoute une légende."}, {"t": "draw", "id": "terr.tunis.croquis", "label": "Mon croquis légendé (dessine avec le doigt)"}, {"t": "text", "id": "terr.tunis.appris", "label": "3 choses que j'ai apprises", "lines": 4, "ph": "1. …\n2. …\n3. …"}, {"t": "text", "id": "terr.tunis.surpris", "label": "Ce qui m'a le plus surpris", "lines": 2, "ph": ""}, {"t": "text", "id": "terr.tunis.guide", "label": "La question que j'ai posée au guide (et sa réponse)", "lines": 3, "ph": ""}, {"t": "stars", "id": "terr.tunis.note", "label": "Ma note pour ce lieu"}, {"t": "pills", "id": "terr.tunis.humeur", "label": "Comment je me sens ?", "options": ["😀 Super", "🙂 Bien", "😐 Bof", "😴 Fatigué(e)"], "multi": false}]}, {"title": "Le Grand Musée égyptien", "sub": "Étape 3 · dossier", "num": 3, "color": "blue", "blocks": [{"t": "info", "title": "Ce qu'il faut savoir", "html": "<p>Construit tout près des pyramides de Gizeh et entièrement ouvert depuis le <b>1<sup>er</sup> novembre 2025</b>, le GEM est l'un des plus grands musées du monde consacrés à une seule civilisation.</p>\n        <p>Pour la première fois, l'ensemble du trésor de <b>Toutânkhamon</b> (plus de 5 000 objets découverts par Howard Carter en <b>1922</b>) y est exposé au même endroit. Dans le grand hall, une statue colossale de <b>Ramsès II</b> d'environ 11 m de haut et 83 tonnes accueille les visiteurs.</p>"}, {"t": "hunt", "id": "gem.hunt", "label": "Chasse au trésor : coche ce que tu trouves et note un détail observé.", "items": ["Le masque funéraire en or de Toutânkhamon (env. 10 kg d'or)", "La statue colossale de Ramsès II", "Un char de Toutânkhamon", "Le trône doré de Toutânkhamon", "Les sarcophages emboîtés", "Une barque solaire de Khéops (plus de 4 500 ans)", "Un objet de la vie quotidienne (jeu, sandale, lit…)", "Une statue d'un dieu à tête d'animal"]}, {"t": "fields", "label": "Fiche d'identité de mon objet préféré", "items": [{"id": "gem.objet.0", "label": "Nom", "lines": 1}, {"id": "gem.objet.1", "label": "Matériaux", "lines": 1}, {"id": "gem.objet.2", "label": "Époque / pharaon", "lines": 1}, {"id": "gem.objet.3", "label": "À quoi servait-il ?", "lines": 1}, {"id": "gem.objet.4", "label": "Pourquoi je l'ai choisi", "lines": 1}]}, {"t": "photos", "id": "gem.objet.ph", "label": "Photo de mon objet préféré", "help": ""}, {"t": "draw", "id": "gem.objet.croquis", "label": "Croquis de mon objet préféré"}]}, {"title": "Gizeh : pyramides et Sphinx", "sub": "Étape 3 · dossier", "num": 3, "color": "blue", "blocks": [{"t": "info", "title": "Ce qu'il faut savoir", "html": "<p>Les trois grandes pyramides sont les tombeaux de trois pharaons de la IV<sup>e</sup> dynastie, il y a environ 4 500 ans : <b>Khéops</b>, son fils <b>Khéphren</b> et <b>Mykérinos</b>. Celle de Khéops, la « Grande Pyramide », est la seule des Sept Merveilles du monde antique encore debout.</p>\n        <p>Elle mesurait à l'origine environ <b>146 m</b> de haut ; elle n'en fait plus qu'environ <b>138 m</b>, car son sommet et son revêtement de calcaire blanc poli ont disparu (les pierres ont été réutilisées pour construire Le Caire). On estime qu'elle compte environ <b>2,3 millions de blocs</b>.</p>\n        <p>Le <b>Sphinx</b> (environ 73 m de long et 20 m de haut) a été taillé directement dans la roche du plateau.</p>"}, {"t": "text", "id": "giz.q1", "label": "1. De combien de mètres la Grande Pyramide a-t-elle « rétréci » ?", "lines": 1, "ph": ""}, {"t": "text", "id": "giz.q2", "label": "2. Si la construction a duré environ 20 ans, combien de blocs fallait-il poser par jour en moyenne ? (1 an = 365 jours)", "lines": 3, "ph": ""}, {"t": "pills", "id": "giz.nummu", "label": "Sur le terrain : observe les blocs de calcaire. As-tu vu des nummulites (petits disques plats, fossiles marins, les mêmes qu'au Fayoum) ?", "options": ["Oui", "Non"], "multi": false}, {"t": "text", "id": "giz.khephren", "label": "De loin, la pyramide de Khéphren semble plus haute que celle de Khéops. Pourquoi, à ton avis ?", "lines": 3, "ph": ""}]}, {"title": "GEM, Gizeh et Sphinx", "sub": "Carnet de terrain", "num": 3, "color": "blue", "blocks": [{"t": "fields", "label": "", "items": [{"id": "terr.gizeh.f.0", "label": "Date", "lines": 1}, {"id": "terr.gizeh.f.1", "label": "Heure d'arrivée", "lines": 1}, {"id": "terr.gizeh.f.2", "label": "Avec qui", "lines": 1}]}, {"t": "pills", "id": "terr.gizeh.meteo", "label": "La météo du jour", "options": ["☀️ Soleil", "☁️ Nuages", "💨 Vent", "🌡️ Très chaud", "❄️ Frais"], "multi": true}, {"t": "photos", "id": "terr.gizeh.ph", "label": "Mes photos du jour", "help": "Prends-les avec le téléphone ou choisis-les dans la galerie, puis ajoute une légende."}, {"t": "draw", "id": "terr.gizeh.croquis", "label": "Mon croquis légendé (dessine avec le doigt)"}, {"t": "text", "id": "terr.gizeh.appris", "label": "3 choses que j'ai apprises", "lines": 4, "ph": "1. …\n2. …\n3. …"}, {"t": "text", "id": "terr.gizeh.surpris", "label": "Ce qui m'a le plus surpris", "lines": 2, "ph": ""}, {"t": "text", "id": "terr.gizeh.guide", "label": "La question que j'ai posée au guide (et sa réponse)", "lines": 3, "ph": ""}, {"t": "stars", "id": "terr.gizeh.note", "label": "Ma note pour ce lieu"}, {"t": "pills", "id": "terr.gizeh.humeur", "label": "Comment je me sens ?", "options": ["😀 Super", "🙂 Bien", "😐 Bof", "😴 Fatigué(e)"], "multi": false}]}, {"title": "Une felouque sur le Nil", "sub": "Étape 4 · dossier", "num": 4, "color": "blue", "blocks": [{"t": "info", "title": "Ce qu'il faut savoir", "html": "<p>La <b>felouque</b> est un voilier traditionnel en bois, sans moteur, avec une grande voile triangulaire. On en voit sur le Nil depuis des siècles.</p>\n        <p>Le Nil, long d'environ <b>6 650 km</b>, coule du <b>sud vers le nord</b>, jusqu'à la Méditerranée. Et en Égypte, le vent souffle le plus souvent <b>du nord</b>. Depuis l'Antiquité, les bateliers descendent donc le fleuve en se laissant porter par le courant, et le remontent en hissant la voile. En hiéroglyphes, « voyager vers le sud » s'écrivait d'ailleurs avec un bateau à la voile gonflée !</p>"}, {"t": "svg", "svg": "<svg viewBox=\"0 0 540 410\" width=\"100%\" style=\"display:block;margin:auto\" fill=\"none\" stroke=\"#2B2118\" stroke-width=\"2.6\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n  \n  <path d=\"M52 334 Q60 360 90 366 Q260 392 440 360 Q470 350 498 300 Q488 316 470 322 Q260 352 52 334 Z\" fill=\"#fff\"/>\n  <path d=\"M30 318 Q40 328 52 334\" stroke-width=\"3\"/>\n  <path d=\"M40 330 L28 372 L46 374 L56 338\" fill=\"#fff\"/>\n  <path d=\"M92 318 L280 14 L460 316 Z\" fill=\"#F4E6C8\"/>\n  <line x1=\"92\" y1=\"318\" x2=\"460\" y2=\"316\" stroke-width=\"3\"/>\n  <line x1=\"378\" y1=\"333\" x2=\"372\" y2=\"168\" stroke-width=\"6\"/>\n  <line x1=\"466\" y1=\"324\" x2=\"274\" y2=\"4\" stroke-width=\"4\"/>\n  <path d=\"M372 172 L360 196\" stroke-width=\"1.6\"/>\n  <path d=\"M0 392 q30 -10 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0\" stroke=\"#3E8EC4\" stroke-width=\"2\"/>\n  <g stroke-width=\"1.2\" stroke-dasharray=\"3 3\">\n    <line x1=\"300\" y1=\"372\" x2=\"330\" y2=\"402\"/><line x1=\"375\" y1=\"250\" x2=\"430\" y2=\"250\"/><line x1=\"240\" y1=\"230\" x2=\"180\" y2=\"200\"/>\n    <line x1=\"320\" y1=\"80\" x2=\"370\" y2=\"60\"/><line x1=\"34\" y1=\"360\" x2=\"10\" y2=\"330\"/>\n  </g>\n  <g font-family=\"Marianne\" font-size=\"20\" font-weight=\"700\" fill=\"#B8532A\" stroke=\"none\">\n    <text x=\"334\" y=\"408\">1</text><text x=\"434\" y=\"256\">2</text><text x=\"164\" y=\"200\">3</text><text x=\"374\" y=\"60\">4</text><text x=\"2\" y=\"326\">5</text>\n  </g>\n</svg>", "label": "", "after": ""}, {"t": "match", "id": "fel.leg", "label": "Légende le schéma : quel numéro pour chaque partie ?", "words": ["coque", "mât", "voile", "vergue (longue pièce de bois qui tient la voile)", "gouvernail"], "options": ["1", "2", "3", "4", "5"]}, {"t": "text", "id": "fel.q1", "label": "1. Pour aller du Caire vers Louxor (au sud), navigue-t-on avec la voile ou avec le courant ?", "lines": 1, "ph": ""}, {"t": "text", "id": "fel.q2", "label": "2. Une felouque avance à environ 5 km/h. Combien d'heures, puis de jours, faudrait-il pour parcourir tout le Nil sans s'arrêter ?", "lines": 3, "ph": ""}, {"t": "text", "id": "fel.q3", "label": "3. Sur place : d'où venait le vent pendant notre balade ? Comment le marin a-t-il réglé la voile ?", "lines": 3, "ph": ""}]}, {"title": "La felouque", "sub": "Carnet de terrain", "num": 4, "color": "blue", "blocks": [{"t": "fields", "label": "", "items": [{"id": "terr.felouque.f.0", "label": "Date", "lines": 1}, {"id": "terr.felouque.f.1", "label": "Heure d'arrivée", "lines": 1}, {"id": "terr.felouque.f.2", "label": "Avec qui", "lines": 1}]}, {"t": "pills", "id": "terr.felouque.meteo", "label": "La météo du jour", "options": ["☀️ Soleil", "☁️ Nuages", "💨 Vent", "🌡️ Très chaud", "❄️ Frais"], "multi": true}, {"t": "photos", "id": "terr.felouque.ph", "label": "Mes photos du jour", "help": "Prends-les avec le téléphone ou choisis-les dans la galerie, puis ajoute une légende."}, {"t": "draw", "id": "terr.felouque.croquis", "label": "Mon croquis légendé (dessine avec le doigt)"}, {"t": "text", "id": "terr.felouque.appris", "label": "3 choses que j'ai apprises", "lines": 4, "ph": "1. …\n2. …\n3. …"}, {"t": "text", "id": "terr.felouque.surpris", "label": "Ce qui m'a le plus surpris", "lines": 2, "ph": ""}, {"t": "text", "id": "terr.felouque.guide", "label": "La question que j'ai posée au guide (et sa réponse)", "lines": 3, "ph": ""}, {"t": "stars", "id": "terr.felouque.note", "label": "Ma note pour ce lieu"}, {"t": "pills", "id": "terr.felouque.humeur", "label": "Comment je me sens ?", "options": ["😀 Super", "🙂 Bien", "😐 Bof", "😴 Fatigué(e)"], "multi": false}]}, {"title": "Khan el-Khalili et Le Caire islamique", "sub": "Étape 5 · dossier", "num": 5, "blocks": [{"t": "info", "title": "Ce qu'il faut savoir", "html": "<p>Le souk de <b>Khan el-Khalili</b> doit son nom à un caravansérail (un « khan ») construit en <b>1382</b> par l'émir Djaharkas el-Khalili : les marchands venus de loin y logeaient avec leurs bêtes et leurs marchandises. C'est aujourd'hui l'un des plus grands marchés du Moyen-Orient : lampes, épices, tissus, bijoux, cuivre…</p>\n        <p>Il se trouve au cœur du <b>Caire historique</b>, inscrit au patrimoine mondial de l'UNESCO et surnommé « la ville aux mille minarets ». Tout près, la mosquée <b>Al-Azhar</b>, fondée en 970, abrite l'une des plus anciennes universités du monde.</p>"}, {"t": "match", "id": "khan.voc", "label": "Vocabulaire de l'architecte : choisis la lettre de la bonne définition.", "defs": [["A", "Toit en forme de demi-sphère, au-dessus d'une salle."], ["B", "Décor de feuillages et de lignes entrelacées qui se répètent."], ["C", "Art de la belle écriture, ici en arabe, utilisé comme décor."], ["D", "Tour d'une mosquée, d'où l'on appelait à la prière."], ["E", "Grille de bois ajourée devant une fenêtre : elle laisse passer l'air et cache l'intérieur."]], "words": ["Minaret", "Coupole", "Moucharabieh", "Arabesque", "Calligraphie"], "options": ["A", "B", "C", "D", "E"]}, {"t": "svg", "svg": "<svg viewBox=\"0 0 200 200\" width=\"170\" style=\"display:block;margin:auto\" fill=\"none\" stroke=\"#2B2118\" stroke-width=\"2.4\"><rect x=\"30\" y=\"30\" width=\"140\" height=\"140\"/><rect x=\"30\" y=\"30\" width=\"140\" height=\"140\" transform=\"rotate(45 100 100)\"/><circle cx=\"100\" cy=\"100\" r=\"34\"/></svg>", "label": "L'étoile à 8 branches : ce motif très fréquent est formé de deux carrés superposés.", "after": ""}, {"t": "fields", "label": "Géométrie islamique", "items": [{"id": "khan.geo.0", "label": "Quel angle de rotation fait passer d'un carré à l'autre ?", "lines": 1}, {"id": "khan.geo.1", "label": "Combien d'axes de symétrie a l'étoile ?", "lines": 1}, {"id": "khan.geo.2", "label": "Où as-tu trouvé ce motif dans le souk ?", "lines": 1}]}, {"t": "info", "title": "Au souk : l'art de marchander", "html": "<p>« Bikam ? » (Combien ?) · « Ghali awi ! » (C'est trop cher !) · « Akher kalam ? » (Dernier prix ?)</p>"}, {"t": "fields", "label": "Mon marchandage", "items": [{"id": "khan.march.0", "label": "Objet", "lines": 1}, {"id": "khan.march.1", "label": "Prix demandé", "lines": 1}, {"id": "khan.march.2", "label": "Prix payé", "lines": 1}, {"id": "khan.march.3", "label": "Réduction obtenue (en %)", "lines": 1}, {"id": "khan.march.4", "label": "Ce que j'ai senti / entendu", "lines": 1}]}]}, {"title": "Khan el-Khalili", "sub": "Carnet de terrain", "num": 5, "color": "", "blocks": [{"t": "fields", "label": "", "items": [{"id": "terr.khan.f.0", "label": "Date", "lines": 1}, {"id": "terr.khan.f.1", "label": "Heure d'arrivée", "lines": 1}, {"id": "terr.khan.f.2", "label": "Avec qui", "lines": 1} 150\" width=\"100%\"><g stroke=\"#2B2118\" stroke-width=\"2.4\" fill=\"#E9D3A6\" stroke-linejoin=\"round\">\n      <rect x=\"20\" y=\"100\" width=\"150\" height=\"40\"/>\n      <rect x=\"250\" y=\"116\" width=\"150\" height=\"24\"/><rect x=\"265\" y=\"92\" width=\"120\" height=\"24\"/><rect x=\"280\" y=\"68\" width=\"90\" height=\"24\"/><rect x=\"295\" y=\"44\" width=\"60\" height=\"24\"/>\n      <polygon points=\"480,140 565,30 650,140\"/></g>\n      <g font-family=\"Marianne\" font-size=\"22\" font-weight=\"700\" fill=\"#B8532A\" text-anchor=\"middle\"><text x=\"95\" y=\"80\">1</text><text x=\"325\" y=\"30\">2</text><text x=\"565\" y=\"20\">3</text></g>\n      <g font-family=\"Marianne\" font-size=\"26\" fill=\"#2B2118\"><text x=\"195\" y=\"110\">→</text><text x=\"425\" y=\"110\">→</text></g></svg>", "label": "Du mastaba à la pyramide", "after": ""}, {"t": "fields", "label": "Nomme chaque étape et donne un exemple de monument vu pendant le voyage", "items": [{"id": "sak.etapes.0", "label": "Étape 1", "lines": 1}, {"id": "sak.etapes.1", "label": "Étape 2", "lines": 1}, {"id": "sak.etapes.2", "label": "Étape 3", "lines": 1}]}, {"t": "text", "id": "sak.gradins", "label": "Sur place : combien de gradins comptes-tu sur la pyramide de Djéser ? Que vois-tu autour d'elle (murs, cours, tombes…) ?", "lines": 3, "ph": ""}, {"t": "text", "id": "sak.apis", "label": "Au Sérapéum : pourquoi les Égyptiens enterraient-ils le taureau Apis comme un roi ? Comment ont-ils pu déplacer des sarcophages aussi lourds dans des galeries souterraines ? Fais des hypothèses.", "lines": 4, "ph": ""}]}, {"title": "Sakkarah et Sérapéum", "sub": "Carnet de terrain", "num": 6, "color": "", "blocks": [{"t": "fields", "label": "", "items": [{"id": "terr.sakkarah.f.0", "label": "Date", "lines": 1}, {"id": "terr.sakkarah.f.1", "label": "Heure d'arrivée", "lines": 1}, {"id": "terr.sakkarah.f.2", "label": "Avec qui", "lines": 1}]}, {"t": "pills", "id": "terr.sakkarah.meteo", "label": "La météo du jour", "options": ["☀️ Soleil", "☁️ Nuages", "💨 Vent", "🌡️ Très chaud", "❄️ Frais"], "multi": true}, {"t": "photos", "id": "terr.sakkarah.ph", "label": "Mes photos du jour", "help": "Prends-les avec le téléphone ou choisis-les dans la galerie, puis ajoute une légende."}, {"t": "draw", "id": "terr.sakkarah.croquis", "label": "Mon croquis légendé (dessine avec le doigt)"}, {"t": "text", "id": "terr.sakkarah.appris", "label": "3 choses que j'ai apprises", "lines": 4, "ph": "1. …\n2. …\n3. …"}, {"t": "text", "id": "terr.sakkarah.surpris", "label": "Ce qui m'a le plus surpris", "lines": 2, "ph": ""}, {"t": "text", "id": "terr.sakkarah.guide", "label": "La question que j'ai posée au guide (et sa réponse)", "lines": 3, "ph": ""}, {"t": "stars", "id": "terr.sakkarah.note", "label": "Ma note pour ce lieu"}, {"t": "pills", "id": "terr.sakkarah.humeur", "label": "Comment je me sens ?", "options": ["😀 Super", "🙂 Bien", "😐 Bof", "😴 Fatigué(e)"], "multi": false}]}, {"title": "Le musée des momies royales", "sub": "Étape 7 · dossier", "num": 7, "color": "blue", "blocks": [{"t": "info", "title": "Ce qu'il faut savoir", "html": "<p>Au <b>Musée national de la Civilisation égyptienne</b> (au sud du Caire), une salle souterraine présente les momies de <b>22 rois et reines</b>, dont Ramsès II et la reine-pharaon Hatchepsout. Elles y ont été transportées le 3 avril 2021 lors d'un grand défilé télévisé : la « Parade dorée des pharaons ».</p>\n        <p>Pour les Égyptiens, le corps devait être conservé pour que l'âme du défunt puisse vivre dans l'au-delà. La momification durait environ <b>70 jours</b>.</p>"}, {"t": "order", "id": "mom.ordre", "label": "Les étapes de la momification sont dans le désordre. Remets-les dans l'ordre.", "n": 6, "letters": ["A", "B", "C", "D", "E", "F"], "items": [["A", "On ouvre le flanc gauche et on retire les organes (sauf le cœur), qui sont rangés dans des vases canopes."], ["B", "On remplit le corps de lin et de résine, puis on l'enduit d'huiles parfumées."], ["C", "On lave le corps avec de l'eau du Nil."], ["D", "On enveloppe le corps de bandelettes de lin, en glissant des amulettes protectrices entre les couches."], ["E", "On recouvre le corps de natron (un sel naturel) pendant environ 40 jours pour le dessécher."], ["F", "On retire le cerveau par le nez à l'aide d'un long crochet."]]}, {"t": "text", "id": "mom.coeur", "label": "Pourquoi garde-t-on le cœur dans le corps ? (demande au guide ou cherche dans le musée)", "lines": 3, "ph": ""}, {"t": "text", "id": "mom.debat", "label": "Débat : est-ce une bonne idée d'exposer des momies dans un musée ? Donne ton avis avec au moins un argument « pour » et un argument « contre ».", "lines": 6, "ph": ""}]}, {"title": "Les momies", "sub": "Carnet de terrain", "num": 7, "color": "blue", "blocks": [{"t": "fields", "label": "", "items": [{"id": "terr.momies.f.0", "label": "Date", "lines": 1}, {"id": "terr.momies.f.1", "label": "Heure d'arrivée", "lines": 1}, {"id": "terr.momies.f.2", "label": "Avec qui", "lines": 1}]}, {"t": "pills", "id": "terr.momies.meteo", "label": "La météo du jour", "options": ["☀️ Soleil", "☁️ Nuages", "💨 Vent", "🌡️ Très chaud", "❄️ Frais"], "multi": true}, {"t": "photos", "id": "terr.momies.ph", "label": "Mes photos du jour", "help": "Prends-les avec le téléphone ou choisis-les dans la galerie, puis ajoute une légende."}, {"t": "draw", "id": "terr.momies.croquis", "label": "Mon croquis légendé (dessine avec le doigt)"}, {"t": "text", "id": "terr.momies.appris", "label": "3 choses que j'ai apprises", "lines": 4, "ph": "1. …\n2. …\n3. …"}, {"t": "text", "id": "terr.momies.surpris", "label": "Ce qui m'a le plus surpris", "lines": 2, "ph": ""}, {"t": "text", "id": "terr.momies.guide", "label": "La question que j'ai posée au guide (et sa réponse)", "lines": 3, "ph": ""}, {"t": "stars", "id": "terr.momies.note", "label": "Ma note pour ce lieu"}, {"t": "pills", "id": "terr.momies.humeur", "label": "Comment je me sens ?", "options": ["😀 Super", "🙂 Bien", "😐 Bof", "😴 Fat function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("carnet-"+APPID,1);r.onupgradeneeded=()=>{r.result.createObjectStore("kv");r.result.createObjectStore("photos")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

function allOf(store){return new Promise(res=>{const out={};const c=tx(store,"readonly").openCursor();c.onsuccess=e=>{const cur=e.target.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)}})}
let saveT;

async function compress(file,max=1600){
  try{const bmp=await createImageBitmap(file);let w=bmp.width,h=bmp.height;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(bmp,0,0,w,h);
    return await new Promise(res=>c.toBlob(b=>res(b||file),"image/jpeg",.82))}catch(e){return file}}

  const sz=el("button",{class:"s"},"Trait fin");sz.onclick=()=>{size=size===4?10:4;sz.textContent=size===4?"Trait fin":"Trait épais"};tools.appendChild(sz);

  const cl=el("button",{class:"s"},"Effacer tout");cl.onclick=()=>{if(confirm("Effacer tout le dessin ?")){ctx.clearRect(0,0,cv.width,cv.height);put(b.id,"")}};tools.appendChild(cl);
  c.appendChild(tools);let ctx;
  requestAnimationFrame(()=>{const r=cv.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*dpr);cv.height=Math.round(300*dpr);ctx=cv.getContext("2d");ctx.lineCap="round";ctx.lineJoin="round";
    if(S[b.id]){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,cv.width,cv.height);im.src=S[b.id]}
    let drawing=false,last=null;const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
    cv.addEventListener("pointerdown",e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId)});
    cv.addEventListener("pointermove",e=>{if(!drawing)return;const p=pos(e);ctx.globalCompositeOperation=erase?"destination-out":"source-over";ctx.strokeStyle=col;ctx.lineWidth=(erase?24:size)*dpr;ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p});
    const end=()=>{if(!drawing)return;drawing=false;put(b.id,cv.toDataURL("image/png"))};cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end)});
  return c};
R.frise=b=>{const c=wrap(b);c.appendChild(el("div",{class:"svgw",style:"margin-bottom:10px"},b.svg));b.events.forEach(([l,t,d])=>c.appendChild(el("p",{class:"small",style:"margin:0 0 4px"},`<span class="letter">${l}</span> ${t} <span class="muted">(${d})</span>`)));
  const box=el("div",{class:"frise",style:"margin-top:10px"});b.slots.forEach((s,i)=>{const r=el("div",{class:"slot"},`<b class="small">${s}</b>`);r.appendChild(textInput(b.id+"."+i,"lettres…"));box.appendChild(r)});c.appendChild(box);return c};
R.fossils=b=>{const c=wrap(b);c.appendChild(el("div",{class:"svgw",style:"display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;margin-bottom:10px"},b.guide));const list=el("div");const items=()=>S[b.id]||[];
  function draw(){list.innerHTML="";items().forEach((f,i)=>{const box=el("div",{class:"fossil"},`<div class="lab">Fossile n° ${i+1}</div>`);const sel=el("select");sel.innerHTML=`<option value="">Type de fossile…</option>`+b.types.map(t=>`<option${f.type===t?" selected":""}>${t}</option>`).join("");
    const upd=(k,v)=>put(b.id,items().map((x,j)=>j===i?{...x,[k]:v}:x));sel.onchange=()=>upd("type",sel.value);box.appendChild(sel);
    for(const[k,ph]of[["taille","Taille (mm)"],["desc","Couleur, forme"],["lieu","Lieu de découverte"]]){const inp=el("input",{type:"text",placeholder:ph,style:"margin-top:8px"});inp.value=f[k]||"";inp.addEventListener("input",debounce(()=>upd(k,inp.value),400));box.appendChild(inp)}
    const phb=R.photos({id:b.id+".ph."+(f.fid||i),label:""});phb.className="";box.appendChild(phb);
    const d=el("button",{class:"btn ghost",style:"margin-top:8px"},"Retirer ce fossile");d.onclick=()=>{if(confirm("Retirer ce fossile de la liste ?")){(S[b.id+".ph."+(f.fid||i)]||[]).forEach(p=>delPhoto(p.id));put(b.id,items().filter((x,j)=>j!==i));draw()}};box.appendChild(d);list.appendChild(box)})}
  const add=el("button",{class:"btn full"},"＋ Ajouter un fossile trouvé");add.onclick=()=>{put(b.id,[...items(),{fid:Date.now().toString(36)}]);draw();setTimeout(()=>list.lastChild&&list.lastChild.scrollIntoView({behavior:"smooth"}),50)};
  c.appendChild(list);c.appendChild(add);draw();return c};
R.hiero=b=>{const c=wrap(b);c.appendChild(el("div",{class:"alpha"},b.alpha.map(([l,g,n])=>`<div><span class="hiero g">${g}</span> <b>${l}</b><br><span class="muted">${n}</span></div>`).join("")));
  const l=el("label",{class:"f",style:"margin-top:14px"},`<span>Écris ton prénom : il s'affiche en hiéroglyphes dans le cartouche</span>`);const inp=textInput(b.id+".nom","Ton prénom");l.appendChild(inp);c.appendChild(l);const out=el("div",{class:"hout hiero"});c.appendChild(out);
  const conv=s=>s.toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/CH/g,"§").split("").map(ch=>ch==="§"?"𓍿":(b.map[ch]||(ch===" "?" ":""))).join("");
  const upd=()=>out.textContent=conv(inp.value);inp.addEventListener("input",upd);upd();
  c.appendChild(el("div",{class:"lab",style:"margin-top:16px"},"Pourquoi les noms des pharaons étaient-ils entourés d'un cartouche ?"));c.appendChild(textInput(b.id+".pourquoi","",true,2));
  c.appendChild(el("div",{class:"lab",style:"margin-top:16px"},"Décode ce message secret (les mots sont séparés par des espaces) :"));c.appendChild(el("div",{class:"hiero",style:"font-size:30px;line-height:1.4;text-align:center;margin-bottom:8px"},b.msg));c.appendChild(textInput(b.id+".msg","Le message en français…"));return c};
R.crossword=b=>{const c=wrap(b);const w=el("div",{class:"cw"});const t=el("table");const cells={};
  for(let y=0;y<b.H;y++){const tr=el("tr");for(let x=0;x<b.W;x++){const k=x+","+y;const td=el("td");if(b.cells[k]!==undefined){td.className="w";if(b.nums[k])td.appendChild(el("sup",{},b.nums[k]));const i=el("input",{maxlength:"1","aria-label":"case",autocapitalize:"characters",autocomplete:"off"});i.value=S[b.id+"."+k]||"";i.addEventListener("input",()=>{i.value=i.value.slice(-1).toUpperCase();put(b.id+"."+k,i.value)});cells[k]=i;td.appendChild(i)}tr.appendChild(td)}t.appendChild(tr)}
  w.appendChild(t);c.appendChild(w);c.appendChild(el("div",{class:"clues",style:"margin-top:12px"},`<div class="lab">Horizontalement →</div>${b.across}<div class="lab" style="margin-top:10px">Verticalement ↓</div>${b.down}`));return c};
R.lexique=b=>{const c=wrap(b);b.rows.forEach(([fr,pr,ar],i)=>{const id=b.id+"."+i;const r=el("label",{style:"display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)"});const x=el("input",{type:"checkbox",style:"width:22px;height:22px;accent-color:#B8532A"});x.checked=!!S[id];x.onchange=()=>put(id,x.checked);r.appendChild(x);r.appendChild(el("span",{style:"flex:1"},`<b>${fr}</b><br><span class="small">${pr}</span>`));r.appendChild(el("span",{class:"ar",style:"font-size:22px"},ar));c.appendChild(r)});return c};
R.solutions=b=>{const c=el("div");const ok=sessionStorage.getItem("sol-"+APPID)==="1";if(ok){c.innerHTML=b.html;return c}
  const lk=el("div",{class:"card lock"},`<p style="font-size:40px;margin:0">🔒</p><p>Les solutions sont réservées aux adultes.</p>`);const i=el("input",{type:"text",placeholder:"Code parent"});const go=el("button",{class:"btn alt",style:"margin-top:10px"},"Ouvrir");go.onclick=()=>{if(i.value.trim().toUpperCase()===b.code){sessionStorage.setItem("sol-"+APPID,"1");show(cur)}else toast("Code incorrect")};lk.appendChild(i);lk.appendChild(go);c.appendChild(lk);return c};
R.backup=b=>{const c=el("div");
  c.appendChild(el("div",{class:"info"},`<div class="it">Important</div><p>Tout ce que tu écris, dessines et photographies est enregistré <b>dans ce téléphone</b>, même sans internet. Si l'application est supprimée ou si les données du navigateur sont effacées, tout est perdu : pense à faire une <b>sauvegarde</b> régulièrement (par exemple chaque soir).</p>`));
  const exp=el("button",{class:"btn full",style:"margin-bottom:10px"},"💾 Sauvegarder mon carnet (fichier)");exp.onclick=exportAll;c.appendChild(exp);
  const imp=el("button",{class:"btn ghost full",style:"margin-bottom:10px"},"📂 Restaurer une sauvegarde");const fi=el("input",{type:"file",accept:".json,application/json",style:"display:none"});imp.onclick=()=>fi.click();fi.onchange=()=>fi.files[0]&&importAll(fi.files[0]);c.appendChild(imp);c.appendChild(fi);
  const pr=el("button",{class:"btn alt full",style:"margin-bottom:10px"},"🖨️ Version à imprimer / PDF");pr.onclick=printAll;c.appendChild(pr);
  const st=el("p",{class:"small muted"});c.appendChild(st);
  if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{st.textContent=`Espace utilisé : ${(e.usage/1e6).toFixed(1)} Mo · ${Object.keys(PH).length} photo(s) enregistrée(s).`});
  return c};
/* ---------- sauvegarde / restauration / impression ---------- */
const b2d=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});
async function exportAll(){toast("Préparation de la sauvegarde…");const photos={};for(const[k,v]of Object.entries(PH))photos[k]=await b2d(v);
  const blob=new Blob([JSON.stringify({app:APPID,date:new Date().toISOString(),kv:S,photos})],{type:"application/json"});
  const name=`carnet-${APPID}-${new Date().toISOString().slice(0,10)}.json`;const file=new File([blob],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){}}
  const a=el("a",{href:URL.createObjectURL(blob),download:name});document.body.appendChild(a);a.click();a.remove();toast("Sauvegarde téléchargée")}
async function importAll(file){try{const d=JSON.parse(await file.text());if(d.app!==APPID&&!confirm("Cette sauvegarde vient d'un autre carnet. Continuer ?"))return;
  if(!confirm("Remplacer le contenu actuel par cette sauvegarde ?"))return;
  await new Promise(r=>{const t=db.transaction(["kv","photos"],"readwrite");t.objectStore("kv").clear();t.objectStore("photos").clear();t.oncomplete=r});
  S={};PH={};for(const[k,v]of Object.entries(d.kv||{}))put(k,v);for(const[k,u]of Object.entries(d.photos||{})){const blob=await (await fetch(u)).blob();putPhoto(k,blob)}
  toast("Carnet restauré ✓");show(0)}catch(e){alert("Fichier illisible : "+e.message)}}
function valueHTML(b){const v=k=>esc(S[k]??"");const q=(lab,val)=>val?`<div class="pv-q"><b>${lab||""}</b>${val}</div>`:"";
  switch(b.t){case"text":return q(b.label,v(b.id).replace(/\n/g,"<br>"));
  case"fields":return b.items.map(f=>q(f.label,v(f.id))).join("");
  case"checks":case"hunt":return q(b.label,b.items.map((t,i)=>S[b.id+"."+i]?("✔ "+t+(S[b.id+"."+i+".d"]?" — "+esc(S[b.id+"."+i+".d"]):"")):"").filter(Boolean).join("<br>"));
  case"stars":return S[b.id]?q(b.label,"★".repeat(S[b.id])+"☆".repeat(5-S[b.id])):"";
  case"pills":{const x=S[b.id];const arr=b.multi?(x||[]):(x==null?[]:[x]);return q(b.label,arr.map(i=>b.options[i]).join(", "))}
  case"photos":{const ps=S[b.id]||[];return ps.length?`<div class="pv-q"><b>${b.label||"Photos"}</b><div class="pv-imgs">${ps.map(p=>PH[p.id]?`<figure style="margin:0;max-width:48%"><img src="${URL.createObjectURL(PH[p.id])}" style="max-width:100%"><figcaption class="small">${esc(p.cap||"")}</figcaption></figure>`:"").join("")}</div></div>`:""}
  case"draw":return S[b.id]?`<div class="pv-q"><b>${b.label||""}</b><img class="pv-draw" src="${S[b.id]}"></div>`:"";
  case"fossils":return (S[b.id]||[]).map((f,i)=>q("Fossile "+(i+1),esc([f.type,f.taille&&f.taille+" mm",f.desc,f.lieu].filter(Boolean).join(" · ")))).join("");
  case"hiero":return q("Mon prénom",v(b.id+".nom"))+q("Message décodé",v(b.id+".msg"));
  default:return""}}
function printAll(){const pv=document.getElementById("printview");pv.innerHTML=DATA.pages.filter(p=>!p.noprint).map(p=>{const body=p.blocks.map(valueHTML).join("");return body?`<section class="pv-page"><div class="sub">${p.sub||""}</div><h2>${p.title}</h2>${body}</section>`:""}).join("");setTimeout(()=>window.print(),300)}
/* ---------- navigation ---------- */
let cur=-1;
function filled(p){let n=0,f=0;for(const b of p.blocks){const keys=[];if(["text","stars","pills","draw","photos","fossils"].includes(b.t))keys.push(b.id);if(b.t==="fields")b.items.forEach(x=>keys.push(x.id));for(const k of keys){n++;const v=S[k];if(v&&(!Array.isArray(v)||v.length))f++}}return n?f/n:null}
function home(){cur=-1;location.hash="";document.getElementById("htitle").textContent=DATA.short;const a=document.getElementById("app");a.innerHTML="";
  a.appendChild(el("div",{class:"cover"},DATA.cover));
  const toc=el("div",{class:"toc"});DATA.pages.forEach((p,i)=>{const pr=filled(p);const lk=el("a",{href:"#"+i},`<div class="n ${p.color||""}">${p.num??"★"}</div><div class="tt"><b>${p.title}</b><span class="small muted">${p.sub||""}</span>${pr!==null?`<div class="prog"><i style="width:${Math.round(pr*100)}%"></i></div>`:""}</div>${pr===1?'<span class="ok">✓</span>':""}`);toc.appendChild(lk)});a.appendChild(toc);
  document.getElementById("pn").innerHTML="";const go=el("button",{class:"btn full"},S.__last!=null?"▶ Reprendre où j'en étais":"▶ Commencer");go.onclick=()=>show(S.__last??0);document.getElementById("pn").appendChild(go);window.scrollTo(0,0)}
function show(i){cur=i;put("__last",i);if(location.hash!=="#"+i)history.replaceState(null,"","#"+i);const p=DATA.pages[i];document.getElementById("htitle").textContent=p.title;const a=document.getElementById("app");a.innerHTML="";
  a.appendChild(el("div",{class:"band"},`<div class="num ${p.color||""}">${p.num??"★"}</div><div><div class="sub">${p.sub||""}</div><h2>${p.title}</h2></div>`));
  for(const b of p.blocks){const f=R[b.t];if(f)a.appendChild(f(b))}
  const pn=document.getElementById("pn");pn.innerHTML="";const pv=el("button",{class:"btn ghost"},"◀ Précédent");pv.disabled=i===0;pv.onclick=()=>show(i-1);const nx=el("button",{class:"btn"},i<DATA.pages.length-1?"Suivant ▶":"Sommaire");nx.onclick=()=>i<DATA.pages.length-1?show(i+1):home();pn.appendChild(pv);pn.appendChild(nx);window.scrollTo(0,0)}
document.getElementById("home").onclick=home;
window.addEventListener("hashchange",()=>{const n=parseInt(location.hash.slice(1));if(!isNaN(n)&&n!==cur&&DATA.pages[n])show(n)});
(async()=>{try{db=await idb();S=await allOf("kv");PH=await allOf("photos")}catch(e){alert("Le stockage n'est pas disponible dans ce navigateur : les réponses ne seront pas enregistrées.")}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

  if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});})();
